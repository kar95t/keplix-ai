[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keplix"
version = "0.1.0"
description = "Contract-first, model-agnostic multi-agent orchestration harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Karan Chourasiya" }
]
keywords = ["agents", "langgraph", "tree-sitter", "orchestration", "multi-agent", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "keyring>=25.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "tree-sitter>=0.22.0",
    "networkx>=3.2.0",
    "docker>=7.0.0",
    "gitpython>=3.1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
media = [
    "playwright>=1.44.0",
    "edge-tts>=6.1.0",
]
telemetry = [
    "langfuse>=2.30.0",
    "opentelemetry-api>=1.24.0",
]
all = [
    "keplix[dev,media,telemetry]",
]

[project.scripts]
keplix = "keplix.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/keplix"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

